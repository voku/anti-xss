on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [
            7.1,
            7.2,
            7.3,
            7.4,
            8.0,
            8.1,
            8.2,
            8.3,
            8.4,
            8.5,
        ]
        composer: [basic]
        include:
          - php: 7.1
            composer: lowest
          - php: 7.3
            composer: lowest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.php }}" == "8.3" ]]; then
            composer config --no-plugins allow-plugins.infection/extension-installer true
            composer require --dev phpstan/phpstan:^2.1 infection/infection:^0.32.7 --no-update
          fi;

          if [[ "${{ matrix.composer }}" == "lowest" ]]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          fi;

          if [[ "${{ matrix.composer }}" == "basic" ]]; then
            composer update --prefer-dist --no-interaction
          fi;

          composer dump-autoload -o

      - name: Run tests
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p build/logs
          if [ "$(php -r 'echo PHP_VERSION_ID;')" -ge 80100 ]; then
            php vendor/bin/phpunit -c phpunit.xml --coverage-clover=build/logs/clover.xml
          else
            php vendor/bin/phpunit -c phpunit9.xml --coverage-clover=build/logs/clover.xml
          fi

      - name: Run phpstan
        if: ${{ matrix.php == '8.3' }}
        run: |
          php vendor/bin/phpstan analyse

      - name: Run Infection with PHPStan
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' && github.event_name == 'pull_request' }}
        env:
          XDEBUG_MODE: coverage
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          php vendor/bin/infection --configuration=infection.json5.dist --git-diff-base="origin/${{ github.base_ref }}" --git-diff-lines

      - name: Upload coverage results to Coveralls
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' }}
        env:
            COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            composer global require php-coveralls/php-coveralls
            php-coveralls --coverage_clover=build/logs/clover.xml -v

      - name: Upload coverage results to Codecov
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: build/logs/clover.xml

      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logs_composer-${{ matrix.composer }}_php-${{ matrix.php }}
          path: |
            build/logs
