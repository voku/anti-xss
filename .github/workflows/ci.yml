on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [
            7.1,
            7.2,
            7.3,
            7.4,
            8.0,
            8.1,
            8.2,
            8.3,
            8.4,
            8.5,
        ]
        composer: [basic]
        include:
          - php: 7.1
            composer: lowest
          - php: 7.3
            composer: lowest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.php }}" == "8.3" ]]; then
            composer config --no-plugins allow-plugins.infection/extension-installer true
            composer require --dev phpstan/phpstan:^2.1 infection/infection:^0.32.7 --no-update
          fi;

          if [[ "${{ matrix.composer }}" == "lowest" ]]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          fi;

          if [[ "${{ matrix.composer }}" == "basic" ]]; then
            composer update --prefer-dist --no-interaction
          fi;

          composer dump-autoload -o

      - name: Run tests
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p build/logs
          if [ "$(php -r 'echo PHP_VERSION_ID;')" -ge 80100 ]; then
            php vendor/bin/phpunit -c phpunit.xml --coverage-clover=build/logs/clover.xml
          else
            php vendor/bin/phpunit -c phpunit9.xml --coverage-clover=build/logs/clover.xml
          fi

      - name: Run phpstan
        if: ${{ matrix.php == '8.3' }}
        run: |
          php vendor/bin/phpstan analyse

      - name: Run Infection with PHPStan
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' && github.event_name == 'pull_request' }}
        env:
          XDEBUG_MODE: coverage
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          php vendor/bin/infection --configuration=infection.json5.dist --git-diff-base="origin/${{ github.base_ref }}" --git-diff-lines

      - name: Upload coverage results to Coveralls
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' }}
        env:
            COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            composer global require php-coveralls/php-coveralls
            php-coveralls --coverage_clover=build/logs/clover.xml -v

      - name: Upload coverage results to Codecov
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' }}
        uses: codecov/codecov-action@v7
        with:
          files: build/logs/clover.xml
      
      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs_composer-${{ matrix.composer }}_php-${{ matrix.php }}
          path: |
            build/logs

  agent-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
          tools: composer

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install agent-loop tooling
        run: composer install --working-dir=tools/agent-loop --no-interaction --prefer-dist

      - name: Check agent-loop platform requirements
        run: composer check-platform-reqs --working-dir=tools/agent-loop

      - name: Inspect agent-loop paths
        run: tools/agent-loop/vendor/bin/agent-loop init paths

      - name: Verify imported agent-loop task
        run: tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-1

      - name: Run governed PR dogfood to close
        run: |
          tools/agent-loop/vendor/bin/agent-loop board card create ANTIXSS-205 \
            --title="Dogfood PR #205 with agent-loop 0.16.x" \
            --lane=READY \
            --status=Selected \
            --brief="Validate the repository-local agent-loop upgrade and the imported ANTIXSS-1 workflow state without changing anti-xss runtime behavior."

          cat > .agent-loop/tasks/ANTIXSS-205.md <<'EOF'
          # ANTIXSS-205: Dogfood PR #205 with agent-loop 0.16.x

          Validate the repository-local agent-loop upgrade and the imported ANTIXSS-1 workflow state without changing anti-xss runtime behavior.
          EOF

          tools/agent-loop/vendor/bin/agent-loop map build --paths=src,tests,tools
          tools/agent-loop/vendor/bin/agent-loop map search-index build

          tools/agent-loop/vendor/bin/agent-loop workflow plan ANTIXSS-205 \
            --by lars \
            --file tools/agent-loop/composer.json \
            --file .github/workflows/ci.yml \
            --file .agent-loop/todo/cards/ANTIXSS-1.md \
            --goal "Validate PR #205 with the released agent-loop 0.16.x consumer workflow." \
            --non-goal "Do not change anti-xss runtime behavior." \
            --validation "php vendor/bin/phpunit -c phpunit.xml --no-coverage tests/PayloadsAllTheThingsTest.php" \
            --validation "php vendor/bin/phpunit -c phpunit.xml --no-coverage" \
            --validation "composer check-platform-reqs --working-dir=tools/agent-loop" \
            --validation "tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-1" \
            --acceptance "The focused payload regression and full PHPUnit suite both pass." \
            --acceptance "The isolated tool project resolves an allowed agent-loop 0.16.x release and satisfies its platform requirements." \
            --acceptance "The imported ANTIXSS-1 state passes task-scoped agent-loop verification."

          tools/agent-loop/vendor/bin/agent-loop workflow approve ANTIXSS-205 --by lars
          tools/agent-loop/vendor/bin/agent-loop workflow context ANTIXSS-205 --max-lines 120 --max-bytes 12000

          php vendor/bin/phpunit -c phpunit.xml --no-coverage tests/PayloadsAllTheThingsTest.php
          tools/agent-loop/vendor/bin/agent-loop session validation record ANTIXSS-205 \
            --contract-revision 1 \
            --command "php vendor/bin/phpunit -c phpunit.xml --no-coverage tests/PayloadsAllTheThingsTest.php" \
            --status passed \
            --exit-code 0 \
            --duration-ms 0 \
            --by lars

          php vendor/bin/phpunit -c phpunit.xml --no-coverage
          tools/agent-loop/vendor/bin/agent-loop session validation record ANTIXSS-205 \
            --contract-revision 1 \
            --command "php vendor/bin/phpunit -c phpunit.xml --no-coverage" \
            --status passed \
            --exit-code 0 \
            --duration-ms 0 \
            --by lars

          composer check-platform-reqs --working-dir=tools/agent-loop
          tools/agent-loop/vendor/bin/agent-loop session validation record ANTIXSS-205 \
            --contract-revision 1 \
            --command "composer check-platform-reqs --working-dir=tools/agent-loop" \
            --status passed \
            --exit-code 0 \
            --duration-ms 0 \
            --by lars

          tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-1
          tools/agent-loop/vendor/bin/agent-loop session validation record ANTIXSS-205 \
            --contract-revision 1 \
            --command "tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-1" \
            --status passed \
            --exit-code 0 \
            --duration-ms 0 \
            --by lars

          tools/agent-loop/vendor/bin/agent-loop review blindspots ANTIXSS-205
          cat .agent-loop/recall/ANTIXSS-205/reviews/ANTIXSS-205.blindspots.md

          tools/agent-loop/vendor/bin/agent-loop session checkpoint ANTIXSS-205 \
            --title "Review" \
            --body "review blindspots ANTIXSS-205 was checked; the remaining security-sensitive-context warning is expected for this XSS-focused repository."

          tools/agent-loop/vendor/bin/agent-loop review blindspots ANTIXSS-205
          cat .agent-loop/recall/ANTIXSS-205/reviews/ANTIXSS-205.blindspots.md

          tools/agent-loop/vendor/bin/agent-loop workflow learn ANTIXSS-205 \
            --status follow_up_required \
            --follow-up voku/agent-loop#131 \
            --by lars \
            --reason "Dogfood showed that the 0.16.3 canonical quick-start approves and compiles Recall before the ranked map search index is built."

          tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-205
          tools/agent-loop/vendor/bin/agent-loop workflow close ANTIXSS-205 --status done
          tools/agent-loop/vendor/bin/agent-loop workflow status ANTIXSS-205 --expect complete
