on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [
            7.1,
            7.2,
            7.3,
            7.4,
            8.0,
            8.1,
            8.2,
            8.3,
            8.4,
            8.5,
        ]
        composer: [basic]
        include:
          - php: 7.1
            composer: lowest
          - php: 7.3
            composer: lowest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.php }}" == "8.3" ]]; then
            composer config --no-plugins allow-plugins.infection/extension-installer true
            composer require --dev phpstan/phpstan:^2.1 infection/infection:^0.32.7 --no-update
          fi;

          if [[ "${{ matrix.composer }}" == "lowest" ]]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          fi;

          if [[ "${{ matrix.composer }}" == "basic" ]]; then
            composer update --prefer-dist --no-interaction
          fi;

          composer dump-autoload -o

      - name: Run tests
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p build/logs
          if [ "$(php -r 'echo PHP_VERSION_ID;')" -ge 80100 ]; then
            php vendor/bin/phpunit -c phpunit.xml --coverage-clover=build/logs/clover.xml
          else
            php vendor/bin/phpunit -c phpunit9.xml --coverage-clover=build/logs/clover.xml
          fi

      - name: Run phpstan
        if: ${{ matrix.php == '8.3' }}
        run: |
          php vendor/bin/phpstan analyse

      - name: Run Infection with PHPStan
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' && github.event_name == 'pull_request' }}
        env:
          XDEBUG_MODE: coverage
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          php vendor/bin/infection --configuration=infection.json5.dist --git-diff-base="origin/${{ github.base_ref }}" --git-diff-lines

      - name: Upload coverage results to Coveralls
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' }}
        env:
            COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            composer global require php-coveralls/php-coveralls
            php-coveralls --coverage_clover=build/logs/clover.xml -v

      - name: Upload coverage results to Codecov
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/logs/clover.xml

      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs_composer-${{ matrix.composer }}_php-${{ matrix.php }}
          path: |
            build/logs

  agent-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.3
          coverage: none
          tools: composer

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install agent-loop tooling
        run: composer install --working-dir=tools/agent-loop --no-interaction --prefer-dist

      - name: Check agent-loop platform requirements
        run: composer check-platform-reqs --working-dir=tools/agent-loop

      - name: Inspect agent-loop paths
        run: tools/agent-loop/vendor/bin/agent-loop init paths

      - name: Verify imported agent-loop task
        run: tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-1

      - name: Run governed PR dogfood to close
        run: |
          cat > .agent-loop/tasks/ANTIXSS-209.md <<'EOF'
          # ANTIXSS-209: Dogfood the agent-loop 0.20.x consumer workflow

          Validate the repository-local agent-loop upgrade and the imported ANTIXSS-1 workflow state without changing anti-xss runtime behavior.
          EOF

          tools/agent-loop/vendor/bin/agent-loop workflow plan ANTIXSS-209 \
            --by ci \
            --file tools/agent-loop/composer.json \
            --file .github/workflows/ci.yml \
            --file .agent-loop/todo/cards/ANTIXSS-1.md \
            --scope tools/agent-loop/composer.json \
            --scope .github/workflows/ci.yml \
            --goal "Validate PR #209 with the released agent-loop 0.20.x consumer workflow." \
            --non-goal "Do not change anti-xss runtime behavior." \
            --validation "php vendor/bin/phpunit -c phpunit.xml --no-coverage tests/PayloadsAllTheThingsTest.php" \
            --validation "php vendor/bin/phpunit -c phpunit.xml --no-coverage" \
            --validation "composer check-platform-reqs --working-dir=tools/agent-loop" \
            --validation "tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-1" \
            --acceptance "The focused payload regression and full PHPUnit suite both pass." \
            --acceptance "The isolated tool project resolves an allowed agent-loop 0.20.x release and satisfies its platform requirements." \
            --acceptance "The imported ANTIXSS-1 state passes task-scoped agent-loop verification."

          tools/agent-loop/vendor/bin/agent-loop workflow approve ANTIXSS-209 --by ci
          tools/agent-loop/vendor/bin/agent-loop enter ANTIXSS-209 --format=json > /tmp/agent-loop-enter.json

          php -r '
          $payload = json_decode((string) file_get_contents("/tmp/agent-loop-enter.json"), true, 512, JSON_THROW_ON_ERROR);
          if (($payload["mutation_ready"] ?? false) !== true) {
              fwrite(STDERR, "agent-loop enter did not make ANTIXSS-209 mutation-ready.\n");
              exit(1);
          }
          '

          set +e
          tools/agent-loop/vendor/bin/agent-loop finish ANTIXSS-209 --format=json > /tmp/agent-loop-finish.json
          finish_exit=$?
          set -e

          if [[ "$finish_exit" -ne 0 && "$finish_exit" -ne 1 ]]; then
            cat /tmp/agent-loop-finish.json
            exit "$finish_exit"
          fi

          if php -r '
          $payload = json_decode((string) file_get_contents("/tmp/agent-loop-finish.json"), true, 512, JSON_THROW_ON_ERROR);
          exit(($payload["complete"] ?? false) === true ? 0 : 1);
          '; then
            cp /tmp/agent-loop-finish.json /tmp/agent-loop-complete.json
          else
            review_sha="$(
              php -r '
              $payload = json_decode((string) file_get_contents("/tmp/agent-loop-finish.json"), true, 512, JSON_THROW_ON_ERROR);
              $sha = $payload["review_presentation"]["review_sha256"] ?? null;
              if (!is_string($sha) || $sha === "") {
                  fwrite(STDERR, "agent-loop finish did not expose a current review SHA.\n");
                  exit(1);
              }
              echo $sha;
              '
            )"

            tools/agent-loop/vendor/bin/agent-loop finish ANTIXSS-209 --format=json \
              --reviewed-report-sha256 "$review_sha" \
              --learning no_durable_learning \
              --learning-reason "Dependency-upgrade dogfood produced no reusable anti-xss project guidance." \
              --by ci \
              > /tmp/agent-loop-complete.json
          fi

          php -r '
          $payload = json_decode((string) file_get_contents("/tmp/agent-loop-complete.json"), true, 512, JSON_THROW_ON_ERROR);
          if (($payload["complete"] ?? false) !== true || ($payload["next_action"] ?? null) !== "none") {
              fwrite(STDERR, "ANTIXSS-209 did not complete through the agent-loop finish boundary.\n");
              exit(1);
          }
          '

          tools/agent-loop/vendor/bin/agent-loop verify --task-id=ANTIXSS-209
